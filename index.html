<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benjamin Curtis — Resume</title>
<meta name="description" content="Resume of Benjamin Curtis, Director of Technology and AI Operations, The Zero Hour Group.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta http-equiv="refresh" content="0; url=Benjamin-Curtis-Resume.pdf">
<style>
  :root{
    --zero-black:#080808;
    --midnight:#0A0A1A;
    --signal:#E17E30;
    --amber:#FCB142;
    --chrome:#F3F3F3;
    --steel:#A4A6A8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--zero-black);
    background-image:radial-gradient(ellipse at 50% 0%, var(--midnight) 0%, var(--zero-black) 70%);
    color:var(--chrome);
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .wrap{max-width:520px}
  .name{
    font-family:'Montserrat','Segoe UI',system-ui,sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,40px);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:0 0 10px;
    color:var(--chrome);
  }
  .role{
    font-size:clamp(12px,2.6vw,14px);
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--signal);
    font-weight:600;
    margin:0 0 28px;
  }
  .rule{
    width:56px;height:2px;margin:0 auto 28px;
    background:linear-gradient(90deg,var(--signal),var(--amber));
  }
  .msg{color:var(--steel);font-size:15px;margin:0 0 22px}
  a.btn{
    display:inline-block;
    padding:13px 26px;
    border:1px solid var(--signal);
    border-radius:2px;
    color:var(--amber);
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    letter-spacing:.1em;
    text-transform:uppercase;
    transition:background .18s ease,color .18s ease;
  }
  a.btn:hover,a.btn:focus{background:var(--signal);color:var(--zero-black)}
  .foot{margin-top:34px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5a5a63}
  .foot a{color:#5a5a63;text-decoration:none;border-bottom:1px solid #2a2a32}
  .foot a:hover{color:var(--steel)}
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="name">Benjamin Curtis</h1>
    <p class="role">Director of Technology &amp; AI Operations</p>
    <div class="rule"></div>
    <p class="msg">Opening resume&hellip;</p>
    <a class="btn" href="Benjamin-Curtis-Resume.pdf">View Resume (PDF)</a>
    <p class="foot">The Zero Hour Group &middot; <a href="https://thezerohourgroup.com">thezerohourgroup.com</a></p>
  </main>
  <script>
    // Belt and braces: if the meta refresh is blocked, send them anyway.
    setTimeout(function(){
      if (!document.hidden) location.replace('Benjamin-Curtis-Resume.pdf');
    }, 600);
  </script>
</body>
</html>
